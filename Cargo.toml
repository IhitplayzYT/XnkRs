prost = "0.14.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1" , features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1.0" , features = ["v4","v7","serde"]}
supabase-client-sdk = { version = "0.1", features = ["auth", "storage", "realtime"] }
phonenumber = "0.3.10"
